<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ArUco">
<meta name="theme-color" content="#000000">
<title>ArUco Reader</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="ui.css?v=26">
<style>
  /* Reader page. Shared tokens and components live in ui.css. */
  html, body { height: 100%; overflow: hidden; -webkit-user-select: none; user-select: none; touch-action: manipulation; }

  /* The camera area uses the largest viewport height, so Safari's toolbar collapsing or
     expanding never resizes (and visibly rescales) the picture. */
  #stage { position: fixed; top: 0; left: 0; right: 0; height: 100%; height: 100lvh; touch-action: none; overflow: hidden; }
  /* The camera is painted into the opaque #overlay with the outlines. The video element
     stays full size underneath (browsers keep delivering frames for on-screen video). */
  #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; background: var(--bg); }

  /* ---- chrome over the camera ---- */
  .glass { background: var(--glass); color: var(--fg); -webkit-backdrop-filter: blur(16px) saturate(1.3); backdrop-filter: blur(16px) saturate(1.3); }
  .top {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2;
    display: flex; align-items: center; gap: 8px;
    padding: calc(env(safe-area-inset-top, 0px) + 8px) var(--sr) 8px var(--sl);
  }
  .top .spacer { flex: 1; }
  .setbtn { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border: 0; border-radius: var(--r-s); font: 500 15px var(--font); }
  .setbtn svg { width: 12px; height: 12px; }
  /* Live indicator: a marker cell, filled while frames are being read. */
  .cellmark { width: 10px; height: 10px; border: 2px solid currentColor; }
  .cellmark.live { background: currentColor; }
  .round { width: 44px; height: 44px; border-radius: var(--r-s); border: 0; display: grid; place-items: center; flex: none; }
  .round[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .stat { white-space: pre-line; position: fixed; z-index: 2; left: var(--sl); top: calc(env(safe-area-inset-top, 0px) + 62px); font: 500 11px/1.4 var(--font); text-shadow: 0 1px 2px #000; font-variant-numeric: tabular-nums; pointer-events: none; }
  /* Small labels over the camera: zoom level, paused, the one-time tap hint, notices. */
  .pill { position: fixed; z-index: 2; left: 50%; transform: translateX(-50%); padding: 9px 14px; border-radius: var(--r-s); font: 600 15px var(--font); pointer-events: none; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .zoomhint { bottom: calc(var(--panel-h, 140px) + 14px); opacity: 0; transition: opacity .25s; }
  .zoomhint.on { opacity: 1; transition: none; }
  .taphint { top: 50%; transform: translate(-50%, -50%); }
  /* Paused: a white frame around the picture and a small label, nothing over the markers. */
  .frozen { top: calc(env(safe-area-inset-top, 0px) + 64px); display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; font-size: 14px; }
  .frozen svg { width: 12px; height: 12px; }
  #stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 0 3px #fff; opacity: 0; transition: opacity 120ms; }
  body.paused #stage::after { opacity: 1; }
  .taphint { animation: fade-in 200ms ease-out; }
  .notice { position: fixed; z-index: 4; left: var(--sl); right: var(--sr); bottom: calc(var(--panel-h, 140px) + 14px); padding: 12px 14px; border-radius: var(--r-s); font: 500 15px/1.35 var(--font); }

  /* ---- tag strip along the bottom ---- */
  .bottom {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
    background: var(--bg); border-top: 1px solid var(--hair);
    padding: 10px var(--sr) calc(env(safe-area-inset-bottom, 0px) + 12px) var(--sl);
    display: grid; gap: 8px;
  }
  .bar { display: flex; align-items: center; gap: 4px; }
  .bar .count { flex: 1; font: 600 15px var(--font); color: var(--muted); }
  .list { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; min-width: 0; min-height: 56px; align-items: center; }
  .list::-webkit-scrollbar { display: none; }
  .list .hint { color: var(--muted); font-size: 15px; }
  /* Each card wears its marker's colour (the same as its outline on the camera): a dim
     border while out of view, full colour with a faint tint while in view. */
  .card {
    flex: none; display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px;
    border: 1.5px solid color-mix(in srgb, var(--c) 35%, transparent); border-radius: var(--r-s); background: var(--bg);
    transition: border-color 150ms, background-color 150ms;
  }
  .card.live { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--bg)); }
  .card .mini { width: 38px; height: 38px; flex: none; border-radius: 3px; overflow: hidden; }
  .card .mini svg { width: 100%; height: 100%; display: block; shape-rendering: crispEdges; }
  .card .meta { display: grid; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .card b { font: 600 20px var(--font); letter-spacing: -0.01em; }
  .card small { font: 500 12px var(--font); color: var(--muted); }

  /* ---- settings sheet ---- */
  .scrim { position: fixed; inset: 0; z-index: 5; background: rgba(0,0,0,0.5); }
  .settings {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; max-height: 86%; overflow-y: auto; overscroll-behavior: contain;
    background: var(--bg); border-top: 1px solid var(--hair); border-radius: var(--r-m) var(--r-m) 0 0;
    padding: 16px var(--sr) calc(env(safe-area-inset-bottom, 0px) + 20px) var(--sl);
    display: grid; gap: 20px;
  }
  .settings:not([hidden]) { animation: sheet-in 200ms cubic-bezier(0.2, 0.8, 0.2, 1); }
  .scrim:not([hidden]) { animation: fade-in 200ms ease-out; }
  .settings header { display: flex; align-items: center; gap: 12px; }
  .settings h2 { flex: 1; }
  .group { display: grid; gap: 10px; }
  .dictname { margin-top: -12px; color: var(--muted); font: 500 13px var(--font); font-variant-numeric: tabular-nums; }
  .more { display: grid; gap: 20px; border-top: 1px solid var(--hair); padding-top: 12px; }
  .more summary { cursor: pointer; font: 600 15px var(--font); color: var(--muted); list-style: none; display: flex; align-items: center; justify-content: space-between; min-height: 32px; }
  .more summary::-webkit-details-marker { display: none; }
  .more summary::after { content: "+"; font: 400 24px/1 var(--font); }
  .more[open] summary::after { content: "−"; }
  .more > .group:first-of-type { margin-top: 6px; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; }
  .build { color: var(--muted); font: 500 12px var(--font); font-variant-numeric: tabular-nums; }

  /* ---- start screen ---- */
  .gate {
    position: fixed; inset: 0; z-index: 3; overflow-y: auto; background: var(--bg);
    padding: calc(env(safe-area-inset-top, 0px) + 24px) var(--sr) calc(env(safe-area-inset-bottom, 0px) + 20px) var(--sl);
    display: flex; flex-direction: column;
  }
  .gate .inner { width: 100%; max-width: 420px; margin: 0 auto; flex: 1; display: flex; flex-direction: column; gap: 18px; }
  .hero { margin: auto 0 0; display: grid; gap: 18px; justify-items: center; }
  .gate h1 { font: 600 28px/1.15 var(--font); letter-spacing: -0.025em; text-align: center; }
  .gate .actions { margin-top: auto; display: grid; gap: 10px; }
  .gate .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .gate .quiet { justify-self: center; color: var(--muted); font: 500 14px var(--font); padding: 8px; text-decoration: none; }
  .err { color: var(--alert); font-weight: 500; text-align: center; }
  /* While the camera starts, the splash shows only the marker, the name and the status. */
  .gate.starting .pair, .gate.starting .quiet { visibility: hidden; }

  /* ---- a shown marker, as large as fits ---- */
  .sheet { position: fixed; inset: 0; z-index: 7; background: var(--bg); display: grid; grid-template-rows: auto 1fr auto; }
  .sheet header { display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top, 0px) + 12px) var(--sr) 8px var(--sl); }
  .sheet header select { flex: 1; min-width: 0; }
  .sheet .body { display: grid; place-items: center; padding: 12px; min-height: 0; }
  #markerSvg svg { width: min(86vw, 60vh); height: auto; display: block; }
  .sheet footer { display: grid; justify-items: center; gap: 8px; padding: 8px var(--sr) calc(env(safe-area-inset-bottom, 0px) + 18px) var(--sl); }
  .caption { font: 500 13px var(--font); font-variant-numeric: tabular-nums; color: var(--muted); }
  .stepper { display: flex; align-items: stretch; gap: 8px; }
  .stepper button { width: 54px; height: 54px; font: 400 26px/1 var(--font); }
  .stepper input { width: 110px; height: 54px; text-align: center; font: 700 26px var(--font); }
</style>
</head>
<body>

<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
</div>

<div class="top" id="top" hidden>
  <button class="setbtn glass" id="setBtn" aria-label="Marker set and settings"><span class="cellmark" id="live"></span><span id="setName">4×4 · 50 IDs</span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
  <span class="spacer"></span>
  <button class="round glass" id="torch" hidden aria-pressed="false" aria-label="Flashlight">
    <svg class="i" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
  </button>
  <button class="round glass" id="settingsBtn" aria-label="Settings">
    <svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
  </button>
</div>
<div class="stat" id="stat" hidden></div>
<div class="pill zoomhint glass" id="zoomHint" aria-live="polite"></div>
<div class="pill frozen glass" id="frozen" hidden role="status"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3.5 2v8M8.5 2v8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>Paused</div>
<div class="pill taphint glass" id="tapHint" hidden>Tap to pause</div>
<div class="notice glass" id="notice" hidden role="alert"></div>

<div class="bottom" id="bottom" hidden>
  <div class="bar">
    <span class="count" id="seenCount">No tags yet</span>
    <button class="btn text" id="copy">Copy IDs</button>
    <button class="btn text" id="clear">Clear</button>
  </div>
  <div class="list" id="seen"><span class="hint" id="emptyHint">Point the camera at a marker.</span></div>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="settings" id="settings" hidden role="dialog" aria-modal="true" aria-label="Settings">
  <header><h2>Settings</h2><button class="btn ink small" id="settingsDone">Done</button></header>
  <div class="group">
    <h3>Marker type</h3>
    <div class="opts" id="family"></div>
  </div>
  <div class="group" id="sizeGroup">
    <h3>IDs in the set</h3>
    <div class="opts seg" id="size"></div>
  </div>
  <p class="dictname" id="dictName"></p>
  <div class="group">
    <h3>Scan size</h3>
    <div class="opts seg" id="speedOpts"></div>
  </div>
  <details class="more">
    <summary>More settings</summary>
    <div class="group">
      <h3>Camera</h3>
      <div class="opts seg" id="camOpts"></div>
      <div id="lensGroup" hidden><div class="opts" id="lensOpts"></div></div>
      <p id="camNow" class="caption"></p>
    </div>
    <div class="group">
      <h3>Range</h3>
      <div class="opts seg" id="areaOpts"></div>
    </div>
    <div class="group">
      <h3>Error correction</h3>
      <div class="opts seg" id="correctOpts"></div>
    </div>
    <div class="group">
      <h3>Speed readout</h3>
      <div class="opts seg" id="statOpts"></div>
    </div>
  </details>
  <div class="links">
    <button class="btn line small" id="showMarker">Show a marker</button>
    <a class="btn line small" href="generate.html">Print markers</a>
    <a class="btn line small" href="bench.html">Speed test</a>
  </div>
  <p class="build" id="build"></p>
</div>

<div class="gate" id="gate">
  <div class="inner">
    <figure class="hero">
      <svg class="mark" id="mark" viewBox="0 0 8 8" role="img" aria-label="An ArUco marker"></svg>
      <h1>ArUco Reader</h1>
    </figure>
    <div class="actions">
      <button class="btn ink" id="start">Open camera</button>
      <div class="pair">
        <button class="btn line" id="gateMarker">Show a marker</button>
        <a class="btn line" href="generate.html">Print markers</a>
      </div>
      <a class="quiet" href="bench.html">Speed test</a>
      <div class="err" id="err" hidden></div>
    </div>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <header>
    <select id="genSet" aria-label="Marker set"></select>
    <button class="btn ink small" id="genClose">Done</button>
  </header>
  <div class="body"><div id="markerSvg" class="crisp"></div></div>
  <footer>
    <div class="stepper">
      <button class="btn line" id="genPrev" aria-label="Previous ID">−</button>
      <input id="genId" type="number" min="0" value="0" inputmode="numeric" aria-label="Marker ID">
      <button class="btn line" id="genNext" aria-label="Next ID">+</button>
    </div>
    <div class="caption" id="markerCaption"></div>
  </footer>
</div>

<script src="vendor/cv.js"></script>
<script src="vendor/aruco.js"></script>
<script src="markers.js?v=26"></script>
<script src="app.js?v=26"></script>
</body>
</html>
