<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Print Markers</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="ui.css?v=30">
<style>
  /* Sheet generator. Shared tokens and components live in ui.css. The sheets are white
     paper (that is what gets printed) on the dark page. */
  html, body { overflow-x: hidden; }
  .controls {
    position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--hair);
    padding: calc(env(safe-area-inset-top, 0px) + 14px) var(--sr) 14px var(--sl);
    display: flex; flex-wrap: wrap; gap: 12px; align-items: end;
  }
  .controls h1 { flex: 1 0 100%; display: flex; align-items: center; gap: 12px; font: 600 21px/1.2 var(--font); letter-spacing: -0.015em; }
  .controls h1 a { margin-left: auto; }
  label { display: grid; gap: 6px; font: 500 13px var(--font); color: var(--muted); min-width: 0; }
  input[type=number] { width: 88px; }
  input.ids { width: 160px; }
  .note { flex: 1 0 100%; margin: 0; font-size: 14px; }
  .note.warn { color: var(--alert); font-weight: 600; }
  /* On phones the controls fold into one line until "Edit" is tapped, so the sheet gets the screen. */
  .fold { display: none; }
  @media (max-width: 600px) {
    .fold { display: flex; align-items: center; gap: 10px; flex: 1 0 100%; }
    .fold span { flex: 1; min-width: 0; font: 500 15px var(--font); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .controls.folded > :not(h1):not(.fold):not(.print):not(.warn) { display: none !important; }
    .controls { position: static; }
  }
  .summary { margin: 0; padding: 14px var(--sr) 0 var(--sl); color: var(--muted); font: 500 14px var(--font); font-variant-numeric: tabular-nums; }

  /* Pages are laid out at true size in mm; on screen each sits in a wrapper scaled to fit the width. */
  .pages { display: grid; justify-items: center; gap: 16px; padding: 12px var(--sr) 40px var(--sl); }
  .pagewrap { width: calc(var(--pw) * var(--s, 1)); height: calc(var(--ph) * var(--s, 1)); }
  .page { position: relative; overflow: hidden; width: var(--pw); height: var(--ph); background: #fff; color: #000; transform: scale(var(--s, 1)); transform-origin: 0 0; }
  .slot { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1mm; }
  .slot svg { display: block; flex: none; shape-rendering: crispEdges; }
  .cap { font: 500 2.6mm/3mm var(--font); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cut { position: absolute; border: 0 dashed #bbb; }
  .cut.v { width: 0; border-left-width: 0.2mm; }
  .cut.h { height: 0; border-top-width: 0.2mm; }
  .foot { position: absolute; display: flex; align-items: center; justify-content: space-between; gap: 4mm; font: 500 2.4mm/3mm var(--font); color: #444; white-space: nowrap; }
  .foot .bar { display: flex; align-items: center; gap: 1.5mm; }
  .foot svg { display: block; }

  @media print {
    html, body { overflow: visible; background: #fff; }
    .controls, .summary { display: none; }
    .pages { display: block; padding: 0; }
    .pagewrap { width: auto; height: auto; box-shadow: none; }
    /* A hair under the paper height so rounding never spills onto an extra blank sheet. */
    .page { transform: none; height: calc(var(--ph) - 0.5mm); break-after: page; page-break-after: always; }
    .pagewrap:last-child .page { break-after: auto; page-break-after: auto; }
  }
</style>
<style id="pagerule"></style>
</head>
<body>
<div class="controls folded" id="controls">
  <h1>Print markers <a class="btn line small" href="./">Reader</a></h1>
  <div class="fold"><span id="foldText"></span><button class="btn line small" id="foldBtn" aria-expanded="false" aria-controls="controls">Edit</button></div>
  <label>Set <select id="set"></select></label>
  <label>Paper <select id="paper"><option value="a4">A4</option><option value="letter">Letter</option></select></label>
  <label>Orientation <select id="orient"><option value="portrait">Portrait</option><option value="landscape">Landscape</option></select></label>
  <label>Size, mm <input id="size" type="number" min="10" max="250" value="50" inputmode="decimal"></label>
  <label>IDs <select id="mode"><option value="fill">Fill pages</option><option value="list">List</option></select></label>
  <label data-mode="fill">From ID <input id="start" type="number" min="0" value="0" inputmode="numeric"></label>
  <label data-mode="fill">Pages <input id="pages" type="number" min="1" max="300" value="1" inputmode="numeric"></label>
  <label data-mode="list" hidden>List <input id="ids" class="ids" value="0-11" placeholder="0-11, 20-24" inputmode="numeric"></label>
  <label>Labels <select id="labels"><option value="1">On</option><option value="0">Off</option></select></label>
  <label>Cut lines <select id="cuts"><option value="1">On</option><option value="0">Off</option></select></label>
  <button class="btn ink print" id="print">Print</button>
  <p class="note" id="hint">Print at 100%.</p>
  <p class="note warn" id="warn" hidden></p>
</div>
<p class="summary" id="summary"></p>
<div class="pages" id="pages-out"></div>

<script src="vendor/cv.js"></script>
<script src="vendor/aruco.js"></script>
<script src="markers.js?v=30"></script>
<script>
const SETS = MARKER_SETS.map((s) => ({ label: s.name, base: s.base, count: s.count }));
const PAPERS = { a4: { name: 'A4', w: 210, h: 297 }, letter: { name: 'letter', w: 215.9, h: 279.4 } };
// All layout numbers are millimetres.
const MARGIN = 10, GAP = 4, FOOT = 6, LABEL = 4;
const MAX_MARKERS = 300;
const $ = (id) => document.getElementById(id);
const setSel = $('set');
for (const s of SETS) setSel.add(new Option(s.label, s.label));

// Pick up the reader's last set, so "print what I'm scanning" is one tap away.
try {
  const fam = localStorage.getItem('family'), size = localStorage.getItem('size');
  const key = fam && fam.toUpperCase().replace('APRIL ', 'APRILTAG_').replace(' ', '_');
  const guess = key && SETS.find((s) => s.label.toUpperCase().includes(key) && (!s.count || String(s.count) === size));
  if (guess) setSel.value = guess.label;
} catch {}
// US and Canada mostly print on Letter.
if (/-(US|CA)$/i.test(navigator.language || '')) $('paper').value = 'letter';

// IDs from "0-11, 20, 30-35". Out-of-range IDs are dropped before the cap, so an early
// range above the set's size can't crowd out valid IDs listed after it.
function parseIds(text, max) {
  const ids = [];
  let skipped = 0, capped = false;
  for (const part of text.split(/[\s,]+/).filter(Boolean)) {
    const m = part.match(/^(\d+)(?:-(\d+))?$/);
    if (!m) return { error: `“${part}” is not an ID or range.` };
    const lo = Math.min(+m[1], m[2] != null ? +m[2] : +m[1]), hi = Math.max(+m[1], m[2] != null ? +m[2] : +m[1]);
    if (hi > max) skipped += hi - Math.max(lo, max + 1) + 1;
    for (let i = lo; i <= Math.min(hi, max); i++) {
      if (ids.length === MAX_MARKERS) { capped = true; break; }
      ids.push(i);
    }
  }
  return { ids, skipped, capped };
}

// Grid for one page. Each marker gets an equal slot; slots are at least GAP wider/taller than the
// marker (quiet zone and label included), so neighbours are >= GAP apart and cut lines fall on slot edges.
function layout(paper, landscape, mm, n, labels) {
  const W = landscape ? paper.h : paper.w, H = landscape ? paper.w : paper.h;
  const availW = W - 2 * MARGIN, availH = H - 2 * MARGIN - FOOT;
  const labH = labels ? LABEL : 0;
  const k = (n + 2) / n; // generateSVG adds one white cell each side of the n-cell black square
  const fitMm = Math.floor(Math.min((availW - GAP) / k, (availH - GAP - labH) / k));
  const size = Math.min(mm, fitMm);
  const markW = size * k;
  const cols = Math.max(1, Math.floor(availW / (markW + GAP)));
  const rows = Math.max(1, Math.floor(availH / (markW + labH + GAP)));
  return { W, H, availH, mm: size, fitMm, markW, cols, rows, per: cols * rows, slotW: availW / cols, slotH: availH / rows };
}

const f = (v) => +v.toFixed(3);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => `&#${c.charCodeAt(0)};`);

function pageHtml(L, chunk, dict, set, opts, i, total) {
  const svgSize = `width="${f(L.markW)}mm" height="${f(L.markW)}mm"`;
  let h = '';
  chunk.forEach((id, j) => {
    const c = j % L.cols, r = (j / L.cols) | 0;
    h += `<div class="slot" style="left:${f(MARGIN + c * L.slotW)}mm;top:${f(MARGIN + r * L.slotH)}mm;width:${f(L.slotW)}mm;height:${f(L.slotH)}mm">`;
    h += dict.generateSVG(id).replace('<svg ', `<svg ${svgSize} `);
    if (opts.labels) {
      // Full caption when it fits the slot (mono glyph ~0.6em of 2.6 mm), else just the ID.
      const full = `${set.label} · ${id}`;
      h += `<div class="cap">${esc(full.length * 1.6 < L.slotW - 1 ? full : id)}</div>`;
    }
    h += '</div>';
  });
  if (opts.cuts) {
    const usedRows = Math.ceil(chunk.length / L.cols), usedCols = usedRows > 1 ? L.cols : chunk.length;
    const gw = usedCols * L.slotW, gh = usedRows * L.slotH;
    for (let c = 0; c <= usedCols; c++) h += `<i class="cut v" style="left:${f(MARGIN + c * L.slotW - 0.1)}mm;top:${MARGIN}mm;height:${f(gh)}mm"></i>`;
    for (let r = 0; r <= usedRows; r++) h += `<i class="cut h" style="left:${MARGIN}mm;top:${f(MARGIN + r * L.slotH - 0.1)}mm;width:${f(gw)}mm"></i>`;
  }
  h += `<div class="foot" style="left:${MARGIN}mm;width:${f(L.W - 2 * MARGIN)}mm;top:${f(L.H - MARGIN - 4)}mm;height:4mm">`
    + `<span>${esc(set.label)} · ${L.mm} mm · page ${i + 1} of ${total}</span>`
    + `<span class="bar"><svg width="10mm" height="1.5mm" viewBox="0 0 10 1.5"><rect width="10" height="1.5" fill="#000"/></svg>10 mm</span></div>`;
  return `<div class="pagewrap"><div class="page">${h}</div></div>`;
}

const out = $('pages-out');
function fitScale() {
  const pw = parseFloat(out.style.getPropertyValue('--pw')) || 210;
  const room = out.clientWidth - parseFloat(getComputedStyle(out).paddingLeft) - parseFloat(getComputedStyle(out).paddingRight);
  out.style.setProperty('--s', Math.min(1, room / (pw * 96 / 25.4)).toFixed(4));
}

let token = 0;
async function render() {
  const mine = ++token;
  const listMode = $('mode').value === 'list';
  for (const el of document.querySelectorAll('[data-mode]')) el.hidden = (el.dataset.mode === 'list') !== listMode;
  const set = SETS.find((s) => s.label === setSel.value);
  try { await loadDictionary(set.base); } catch { return showWarn(`Could not load ${set.label}. Check your connection and try again.`); }
  if (mine !== token) return; // a newer render started while the dictionary loaded
  const dict = drawingDictionary(set.base);
  const max = (set.count || dict.codeList.length) - 1;
  const opts = { labels: $('labels').value === '1', cuts: $('cuts').value === '1' };
  const paper = PAPERS[$('paper').value], landscape = $('orient').value === 'landscape';
  const want = Math.max(10, Math.min(250, +$('size').value || 50));
  const L = layout(paper, landscape, want, dict.markSize, opts.labels);

  let ids, warn = '';
  if (listMode) {
    const p = parseIds($('ids').value, max);
    if (p.error) return showWarn(p.error);
    ids = p.ids;
    warn = p.skipped ? `IDs above ${max} are not in ${set.label} and were skipped.` : p.capped ? `Showing the first ${MAX_MARKERS} markers.` : '';
  } else {
    const start = Math.max(0, Math.floor(+$('start').value || 0));
    const pages = Math.max(1, Math.floor(+$('pages').value || 1));
    const wantN = L.per * pages;
    const n = Math.max(0, Math.min(wantN, max - start + 1, MAX_MARKERS));
    ids = Array.from({ length: n }, (_, i) => start + i);
    if (start > max) warn = `${set.label} has IDs 0 to ${max}; start lower.`;
    else if (n < wantN) warn = n === MAX_MARKERS ? `Showing the first ${MAX_MARKERS} markers.` : `Stopped at ID ${max}, the last in ${set.label}.`;
  }
  if (want > L.fitMm) warn = `${want} mm does not fit on ${paper.name} ${landscape ? 'landscape' : 'portrait'}; using ${L.fitMm} mm. ` + warn;
  showWarn(warn);

  $('pagerule').textContent = `@page { size: ${paper.name} ${landscape ? 'landscape' : 'portrait'}; margin: 0; }`;
  out.style.setProperty('--pw', L.W + 'mm');
  out.style.setProperty('--ph', L.H + 'mm');
  const total = Math.ceil(ids.length / L.per);
  let html = '';
  for (let i = 0; i < total; i++) html += pageHtml(L, ids.slice(i * L.per, (i + 1) * L.per), dict, set, opts, i, total);
  out.innerHTML = html; // one write, one layout
  fitScale();
  $('foldText').textContent = `${set.label} · ${$('paper').selectedOptions[0].text} · ${L.mm} mm`;
  $('summary').textContent = `${ids.length} marker${ids.length === 1 ? '' : 's'} · ${total} page${total === 1 ? '' : 's'} · ${L.mm} mm · up to ${L.per} per page (${L.cols}×${L.rows})`;
  $('print').disabled = !ids.length;
}
function showWarn(text) {
  $('warn').textContent = text;
  $('warn').hidden = !text;
}

let queued = false;
function schedule() {
  if (queued) return;
  queued = true;
  requestAnimationFrame(() => { queued = false; render(); });
}
for (const id of ['set', 'paper', 'orient', 'size', 'mode', 'start', 'pages', 'ids', 'labels', 'cuts']) $(id).addEventListener('input', schedule);
addEventListener('resize', fitScale);
$('foldBtn').onclick = () => {
  const folded = $('controls').classList.toggle('folded');
  $('foldBtn').textContent = folded ? 'Edit' : 'Done';
  $('foldBtn').setAttribute('aria-expanded', String(!folded));
};
$('print').onclick = () => window.print();
render();
</script>
</body>
</html>
